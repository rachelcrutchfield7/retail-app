name: ReTail CI

on:
  push:
    branches:
      - main
      - "security-phase-**"
  pull_request:

jobs:
  verify:
    name: Typecheck, Test, and Export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format

      - name: Tests
        run: pnpm test

      - name: Web export
        run: pnpm export:web
        env:
          EXPO_PUBLIC_APP_ENV: ci
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-key
