<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>ReTail Listing</title>
  <meta
    name="description"
    content="View this pet supply listing on ReTail."
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #f8f3ea;
      color: #1f2933;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(31, 41, 51, 0.1);
    }

    .brand {
      color: #285943;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .listing-image {
      display: none;
      width: 100%;
      max-height: 440px;
      object-fit: cover;
      border-radius: 16px;
      background: #eef2ee;
    }

    h1 {
      margin: 20px 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }

    .meta {
      margin: 0 0 16px;
      color: #44524b;
      font-weight: 600;
    }

    .description {
      line-height: 1.6;
      color: #59665f;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .button {
      display: inline-block;
      padding: 13px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }

    .primary {
      background: #285943;
      color: white;
    }

    .secondary {
      border: 1px solid #285943;
      color: #285943;
      background: white;
    }

    .loading,
    .unavailable {
      padding: 28px 0;
      text-align: center;
      color: #59665f;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px 10px;
      }

      .card {
        padding: 18px;
        border-radius: 16px;
      }

      h1 {
        font-size: 24px;
      }

      .button {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="brand">ReTail</div>

    <div id="loading" class="loading">
      Loading listing...
    </div>

    <div id="listing" hidden>
      <img
        id="listing-image"
        class="listing-image"
        alt=""
      />

      <h1 id="listing-title"></h1>

      <p id="listing-meta" class="meta"></p>

      <p class="description">
        Buy and sell new or gently used pet supplies with people in your community.
      </p>

      <div class="actions">
        <a id="open-app" class="button primary" href="#">
          Open in ReTail
        </a>

        <a
          id="ios-download"
          class="button secondary"
          href="#"
          hidden
        >
          Download for iPhone
        </a>

        <a
          id="android-download"
          class="button secondary"
          href="#"
          hidden
        >
          Download for Android
        </a>
      </div>
    </div>

    <div id="unavailable" class="unavailable" hidden>
      <h1>This listing is no longer available.</h1>
      <p>
        It may have sold, been removed, or no longer be public.
      </p>

      <a
        class="button primary"
        href="https://retailpetapp.com"
      >
        Visit ReTail
      </a>
    </div>
  </main>

  <script>
    /*
     * ReTail public listing page.
     *
     * The listing data request will be wired to ReTail's existing
     * public-safe Supabase listing RPC during the Cloudflare deployment step.
     *
     * No private seller, shipping, payment, or contact information
     * should ever be rendered here.
     */

    const pathParts = window.location.pathname
      .split("/")
      .filter(Boolean);

    const listingIndex = pathParts.indexOf("listing");
    const listingId =
      listingIndex >= 0
        ? pathParts[listingIndex + 1]
        : null;

    const loading = document.getElementById("loading");
    const listing = document.getElementById("listing");
    const unavailable = document.getElementById("unavailable");

    const openApp = document.getElementById("open-app");

    if (!listingId) {
      loading.hidden = true;
      unavailable.hidden = false;
    } else {
      const canonicalUrl =
        "https://retailpetapp.com/listing/" +
        encodeURIComponent(listingId);

      /*
       * Using the HTTPS URL here is intentional.
       * Once Universal Links / App Links are verified,
       * iOS and Android can open the installed ReTail app directly.
       */
      openApp.href = canonicalUrl;

      /*
       * Actual public listing hydration is added by the Cloudflare
       * worker/API step so no Supabase credentials need to be manually
       * embedded in this file.
       */
      loading.innerText = "Preparing listing...";
    }
  </script>
</body>
</html>
